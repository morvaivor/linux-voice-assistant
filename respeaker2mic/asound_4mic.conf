# ALSA client configuration for the ReSpeaker 4-Mics Pi HAT.
#
# Card "seeed4micvoicec" (seeed-voicecard driver, AC108 codec).
# 4 capture channels via dsnoop, 2-channel stereo playback over plug.
#
# Coexistence with the 2-Mic HAT: the 2-mic installer owns
# /etc/asound.conf. With both HATs installed, LVA must reference the
# 4-mic card by its name (hw:CARD=seeed4micvoicec / seeed4micvoicec)
# instead of "default" — this file is then only used as
# /etc/voicecard/asound_4mic.conf for explicit selection.
#
# Derived from HinTak/seeed-voicecard (asound_4mic.conf),
# Copyright (c) Seeed Technology Co., Ltd, MIT license.

defaults.pcm.rate_converter "samplerate"

pcm.!default {
    type asym
    playback.pcm "playback4"
    capture.pcm "capture4"
}

pcm.playback4 {
    type plug
    slave.pcm "hw:seeed4micvoicec"
}

pcm.capture4 {
    type plug
    slave.pcm "array4"
}

pcm.array4 {
    type dsnoop
    slave {
        pcm "hw:seeed4micvoicec"
        channels 4
    }
    ipc_key 777777
}
